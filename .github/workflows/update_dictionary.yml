name: Update NovelAI & Danbooru Tags Dictionary

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays at 00:00 UTC
  workflow_dispatch: # Allows manual execution from GitHub Web UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AITAG Scraping Script
        run: |
          # Fetch incremental updates (1000 works)
          python -u extract_tags.py 1000

      - name: Run Danbooru Scraping Script
        run: |
          # Fetch incremental high score posts from Danbooru (1000 posts)
          python -u extract_danbooru_tags.py 1000 "score:>=50"

      - name: Run Extra Booru (Safebooru / Yandere) Scraping Script
        run: |
          # Fetch incremental extra posts (500 posts)
          python -u extract_booru_extra.py 500

      - name: Run Know-how Crawling Script
        run: |
          # Crawl and update external NovelAI V4.5 know-how database
          python -u extract_knowhow.py

      - name: Compile Python scripts
        run: |
          python3 -m py_compile \
            extract_tags.py \
            extract_danbooru_tags.py \
            extract_booru_extra.py \
            build_dictionary.py \
            search_prompts.py \
            extract_knowhow.py \
            validate_data.py

      - name: Run Build Dictionary Script
        run: |
          python -u build_dictionary.py

      - name: Test and validate generated data
        run: |
          python3 -m unittest discover -s tests
          python3 validate_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update database from aitag.win and danbooru [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi
