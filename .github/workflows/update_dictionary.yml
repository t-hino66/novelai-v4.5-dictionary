name: Build and deploy prompt evidence dictionary

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the latest source snapshot
        run: |
          gh release download data-snapshot \
            --pattern 'extracted_works.json' \
            --pattern '*_raw_works.json' \
            --dir .
          gh release download data-snapshot \
            --pattern 'extracted_works_v5.json' \
            --dir . || true

      - name: Refresh external source data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -u extract_tags.py 1000
          python -u extract_tags_v5.py 1000
          python -u extract_danbooru_tags.py 1000 "score:>=50"
          python -u extract_booru_extra.py 500
          python -u extract_civitai_tags.py 500
          python -u extract_aibooru_tags.py 500
          python -u extract_knowhow.py

      - name: Ensure V5 source snapshot exists
        run: |
          if [ ! -f extracted_works_v5.json ]; then
            python -u extract_tags_v5.py 1000
          fi
          test -s extracted_works_v5.json

      - name: Compile Python scripts
        run: |
          python -m py_compile \
            extract_tags.py \
            extract_tags_v5.py \
            extract_danbooru_tags.py \
            extract_booru_extra.py \
            extract_civitai_tags.py \
            extract_aibooru_tags.py \
            build_dictionary.py \
            build_v5_dictionary.py \
            build_site.py \
            search_prompts.py \
            extract_knowhow.py \
            validate_data.py

      - name: Build and validate dictionaries
        run: |
          python -u build_dictionary.py
          python -u build_v5_dictionary.py
          python -m unittest discover -s tests
          python validate_data.py
          python build_site.py

      - name: Package rolling data snapshot and exports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: data-snapshot-assets
          path: |
            extracted_works.json
            extracted_works_v5.json
            danbooru_raw_works.json
            booru_extra_raw_works.json
            civitai_raw_works.json
            aibooru_raw_works.json
            novelai_v4_5_database.json
            novelai_v4_5_database.csv
            novelai_v4_5_tag_dictionary.json
            novelai_v4_5_tag_dictionary.csv
            novelai_v4_5_neg_dictionary.json
            novelai_v4_5_dictionary.md
            novelai_v5_database.json
            novelai_v5_database.csv
            novelai_v5_tag_dictionary.json
            novelai_v5_tag_dictionary.csv
            novelai_v5_neg_dictionary.json
            novelai_v5_neg_dictionary.csv
            novelai_v5_dictionary.md
          retention-days: 1

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  snapshot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download generated snapshot assets
        uses: actions/download-artifact@v8
        with:
          name: data-snapshot-assets
          path: data-snapshot-assets

      - name: Update rolling release assets
        run: gh release upload data-snapshot data-snapshot-assets/* --clobber --repo ${{ github.repository }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
